<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 案C: 点線の切り取り線で縁取られた人物と、映像を送り出す電波 (Syphon 送出) -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a3df0"/>
      <stop offset="1" stop-color="#2b1a7a"/>
    </linearGradient>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcd3ff"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <!-- 人物 -->
    <g fill="url(#person)">
      <circle cx="440" cy="430" r="122"/>
      <path d="M190 960 C190 720 300 630 440 630 C580 630 690 720 690 960 Z"/>
    </g>
    <!-- 切り取り線 -->
    <g fill="none" stroke="#ffd84d" stroke-width="16" stroke-dasharray="34 22" stroke-linecap="round">
      <circle cx="440" cy="430" r="160"/>
      <path d="M150 960 C150 700 280 594 440 594 C600 594 730 700 730 960"/>
    </g>
    <!-- 送出の電波 -->
    <g fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round">
      <path d="M690 300 A110 110 0 0 1 690 480" opacity="0.95"/>
      <path d="M750 240 A190 190 0 0 1 750 540" opacity="0.7"/>
      <path d="M810 180 A270 270 0 0 1 810 600" opacity="0.45"/>
    </g>
  </g>
</svg>
