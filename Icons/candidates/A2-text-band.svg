<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 案A2: 案A + 下部の帯にアプリ名 -->
  <defs>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <pattern id="checker" width="103" height="103" patternUnits="userSpaceOnUse" x="100" y="100">
      <rect width="103" height="103" fill="#f2f2f4"/>
      <rect width="51.5" height="51.5" fill="#d9dade"/>
      <rect x="51.5" y="51.5" width="51.5" height="51.5" fill="#d9dade"/>
    </pattern>
    <linearGradient id="person" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff3d6e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#checker)"/>
    <g filter="url(#shadow)" fill="url(#person)">
      <circle cx="512" cy="360" r="128"/>
      <path d="M262 960 C262 720 372 536 512 536 C652 536 762 720 762 960 Z"/>
    </g>
    <rect x="100" y="742" width="824" height="182" fill="#1c1d22"/>
    <text x="512" y="866" font-family="SF Pro Rounded, SF Pro Display, -apple-system, Helvetica Neue, sans-serif" font-weight="800" text-anchor="middle" font-size="96" fill="#ffffff" letter-spacing="-1">NoGreenBack</text>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="4"/>
</svg>
